# stack.landing.yml — Landing Page Octopus
# URL raw para Portainer: actualizar cuando exista el repo remoto de landing.
# Ejemplo: https://raw.githubusercontent.com/fer336/octopus-landing/main/docs/devops/stack.landing.yml
# Fuente activa del stack landing en Portainer.
# En Portainer: Stack > Git repository o Web editor usando esta URL raw.
# Producción usa tag inmutable para forzar actualización de Swarm/Portainer.
# Para rollback, cambiar este tag a una versión numérica anterior.

version: "3.9"

services:
  landing:
    image: ghcr.io/fer336/octopus-landing:1.4.10
    networks:
      - octopus_net
      - network_public
    environment:
      - APP_VERSION=1.4.10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.octopus-landing.rule=Host(`octopustrack.shop`)"
        - "traefik.http.routers.octopus-landing.entrypoints=websecure"
        - "traefik.http.routers.octopus-landing.tls.certresolver=letsencrypt"
        - "traefik.http.services.octopus-landing.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/landing.html"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  octopus_net:
    driver: overlay
    attachable: true
  network_public:
    external: true
    name: network_public
