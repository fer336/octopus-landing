name: Landing Deploy

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a deployar, formato numérico: 1.2.3"
        required: true

permissions:
  contents: write
  packages: write

env:
  EFFECTIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    name: Build & Push Landing Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.docker_tags.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        run: |
          RAW_TAG="${{ env.EFFECTIVE_TAG }}"
          VERSION="${RAW_TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: $RAW_TAG"
            echo "Usá formato numérico: 1.2.3"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RAW_TAG=$RAW_TAG"
          echo "VERSION=$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/octopustrack-landing
          tags: |
            type=raw,value=${{ steps.docker_tags.outputs.version }}
            type=raw,value=latest
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          no-cache: true
          build-args: |
            VITE_OCTOPUS_TRACK_LOGIN_URL=${{ vars.VITE_OCTOPUS_TRACK_LOGIN_URL }}
            VITE_OCTOPUS_FLOW_LOGIN_URL=${{ vars.VITE_OCTOPUS_FLOW_LOGIN_URL }}
            VITE_LANDING_CHECKOUT_URL=${{ vars.VITE_LANDING_CHECKOUT_URL }}
            VITE_LANDING_MP_CHECKOUT_WEBHOOK_URL=${{ vars.VITE_LANDING_MP_CHECKOUT_WEBHOOK_URL }}
            VITE_LANDING_ASSET_WEBHOOK_URL=${{ vars.VITE_LANDING_ASSET_WEBHOOK_URL }}
            APP_VERSION=${{ steps.docker_tags.outputs.version }}

  github-release:
    name: Create Landing Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          generate_release_notes: true
          body: |
            ## Landing publicada

            | Registry | Imagen |
            |---|---|
            | GHCR | `ghcr.io/${{ github.repository_owner }}/octopustrack-landing:${{ needs.build-and-push.outputs.version }}` |
            | GHCR latest | `ghcr.io/${{ github.repository_owner }}/octopustrack-landing:latest` |

            ## Portainer
            El stack de landing debe usar `IMAGE_TAG=latest` o `${{ needs.build-and-push.outputs.version }}`.

  deploy:
    name: Deploy Landing via Portainer Webhook
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Portainer webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_LANDING_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_LANDING_WEBHOOK_URL no configurado. Se omite deploy."
            exit 0
          fi

          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_LANDING_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Landing webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Landing webhook disparado correctamente (HTTP $HTTP_STATUS)"
