server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets from Astro build — cache forever
  location /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /images/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Type application/xml;
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Astro static output: each route has its own index.html
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
